<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta name="theme-color" content="#4f46e5">
    <title>Create Account | Librix</title>
    <link rel="icon" type="image/png" href="../assets/images/favicon.png">
    <link rel="stylesheet" href="../assets/css/global.css">
    <link rel="stylesheet" href="../assets/css/login.css">
    <script src="../assets/js/icons.js"></script>
</head>

<body>
    <main class="login-page">
        <div class="login-container">

            <div class="login-brand">
                <img src="../assets/images/logo.png" alt="Librix Logo">
                <h1>Librix</h1>
            </div>

            <div class="login-card">
                <div class="login-header">
                    <h2>Join Librix Today</h2>
                    <p>Unlock thousands of digital books and smart readability analytics.</p>
                </div>

                <form id="register-form" class="login-form" novalidate>
                    <div id="alert-box" style="display: none; padding: 10px 14px; margin-bottom: 16px; border-radius: var(--radius-md); font-size: var(--font-sm);"></div>

                    <div class="form-group">
                        <label for="name" class="form-label">Full Name <span class="required">*</span></label>
                        <input
                            type="text"
                            id="name"
                            name="name"
                            class="form-input"
                            placeholder="John Doe"
                            autocomplete="name"
                            required
                        >
                        <div class="form-error" id="name-error"></div>
                    </div>

                    <div class="form-group">
                        <label for="email" class="form-label">Email Address <span class="required">*</span></label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            class="form-input"
                            placeholder="your@email.com"
                            autocomplete="email"
                            required
                        >
                        <div class="form-error" id="email-error"></div>
                    </div>

                    <div class="form-group">
                        <label for="org_select" class="form-label">Affiliated Library Organization <span class="required">*</span></label>
                        <select id="org_select" name="org_id" class="form-input" style="height: 44px;">
                            <option value="">Loading organizations...</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="password" class="form-label">Password <span class="required">*</span></label>
                        <div style="position: relative;">
                            <input
                                type="password"
                                id="password"
                                name="password"
                                class="form-input"
                                placeholder="At least 6 characters"
                                autocomplete="new-password"
                                required
                                style="padding-right: 40px;"
                            >
                            <button
                                type="button"
                                id="togglePassword"
                                aria-label="Show password"
                                style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; padding: 0; display: flex; align-items: center; color: var(--text-muted);"
                            >
                                <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/>
                                    <circle cx="12" cy="12" r="3"/>
                                </svg>
                            </button>
                        </div>
                        <div class="form-error" id="password-error"></div>
                    </div>

                    <div class="form-group">
                        <label for="confirm-password" class="form-label">Confirm Password <span class="required">*</span></label>
                        <input
                            type="password"
                            id="confirm-password"
                            name="confirm_password"
                            class="form-input"
                            placeholder="Re-enter your password"
                            autocomplete="new-password"
                            required
                        >
                        <div class="form-error" id="confirm-password-error"></div>
                    </div>

                    <div class="form-group" style="margin-bottom: 20px;">
                        <label class="form-checkbox-label">
                            <input type="checkbox" id="terms" name="terms" class="form-checkbox" required>
                            <span>I agree to the Library Terms & Reading Guidelines</span>
                        </label>
                    </div>

                    <button type="submit" id="submit-btn" class="btn btn-primary" style="width: 100%; padding: 12px; font-weight: 600;">
                        Create Account
                    </button>
                </form>

                <div class="divider">
                    <span>ALREADY A MEMBER?</span>
                </div>

                <div class="register-section">
                    <p>Have an account already?</p>
                    <a href="login.html">Sign in here</a>
                </div>
            </div>

            <a href="../index.html" class="back-home">← Back to Home</a>
        </div>
    </main>

    <footer class="login-footer">
        <p>&copy; 2026 Librix. All rights reserved.</p>
    </footer>

    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/utils.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script>

        document.addEventListener('DOMContentLoaded', function() {
            auth.updateNav();

            api.get('/organizations').then(function(data) {
                const orgSelect = document.getElementById('org_select');
                if (data && data.data) {
                    orgSelect.innerHTML = data.data.map(function(org) {
                        return '<option value="' + org.id + '">' + org.name + ' (' + org.code + ')</option>';
                    }).join('');
                }
            }).catch(function() {
                console.warn('Failed to load organizations');
            });
        });

        const passwordInput = document.getElementById("password");
        const togglePassword = document.getElementById("togglePassword");
        const eyeIcon = document.getElementById("eyeIcon");

        togglePassword.addEventListener("click", function () {
            if (passwordInput.type === "password") {
                passwordInput.type = "text";
                eyeIcon.innerHTML = `<path d="M3 3l18 18"/><path d="M10.58 10.58a2 2 0 0 0 2.83 2.83"/><path d="M9.88 5.08A10.43 10.43 0 0 1 12 5c5 0 8.73 4.11 9.94 6.5a1 1 0 0 1 0 1 2.5 4.5 0 0 1-1.42 1.65"/><path d="M6.61 6.61A10.43 10.43 0 0 0 2.06 11.5a1 1 0 0 0 0 .99C3.27 14.89 7 19 12 19a10.43 10.43 0 0 0 5.39-1.61"/>`;
            } else {
                passwordInput.type = "password";
                eyeIcon.innerHTML = `<path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/>`;
            }
        });

        const form = document.getElementById("register-form");
        const submitBtn = document.getElementById("submit-btn");
        const alertBox = document.getElementById("alert-box");

        function clearErrors() {
            document.querySelectorAll(".form-error").forEach(function(el) { el.textContent = ""; });
            document.querySelectorAll(".form-input").forEach(function(el) { el.style.borderColor = "var(--border)"; });
            alertBox.style.display = "none";
        }

        form.addEventListener("submit", function(e) {
            e.preventDefault();
            clearErrors();

            const name = document.getElementById("name").value.trim();
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;
            const confirmPassword = document.getElementById("confirm-password").value;
            const terms = document.getElementById("terms").checked;

            let hasError = false;

            if (!name) {
                document.getElementById("name-error").textContent = "Name is required";
                document.getElementById("name").style.borderColor = "var(--danger)";
                hasError = true;
            }

            if (!email) {
                document.getElementById("email-error").textContent = "Email is required";
                document.getElementById("email").style.borderColor = "var(--danger)";
                hasError = true;
            } else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                document.getElementById("email-error").textContent = "Please enter a valid email address";
                document.getElementById("email").style.borderColor = "var(--danger)";
                hasError = true;
            }

            if (!password || password.length < 6) {
                document.getElementById("password-error").textContent = "Password must be at least 6 characters";
                document.getElementById("password").style.borderColor = "var(--danger)";
                hasError = true;
            }

            if (password !== confirmPassword) {
                document.getElementById("confirm-password-error").textContent = "Passwords do not match";
                document.getElementById("confirm-password").style.borderColor = "var(--danger)";
                hasError = true;
            }

            if (!terms) {
                alertBox.style.display = "block";
                alertBox.style.backgroundColor = "#fffbeb";
                alertBox.style.color = "#92400e";
                alertBox.style.border = "1px solid #fde68a";
                alertBox.textContent = "Please accept the Library Terms & Reading Guidelines";
                hasError = true;
            }

            if (hasError) return;

            submitBtn.disabled = true;
            submitBtn.textContent = 'Creating account...';

            const orgId = parseInt(document.getElementById("org_select").value) || 1;

            auth.register(name, email, password, orgId).then(function(res) {

                if (res.user && res.user.status === 'pending') {
                    utils.toast("Registration Pending", "Your account has been created but requires approval before you can log in.", "info", 8000);
                    setTimeout(() => {
                        window.location.href = "login.html";
                    }, 3000);
                } else {
                    utils.toast("Account Created", "Welcome to LibriX! Redirecting...", "success");
                    setTimeout(() => {
                        window.location.href = "user/dashboard.html";
                    }, 1000);
                }

            }).catch(function(err) {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Create Account';

                alertBox.style.display = "block";
                alertBox.style.backgroundColor = "#fee2e2";
                alertBox.style.color = "#991b1b";
                alertBox.style.border = "1px solid #fecaca";
                alertBox.textContent = (err && err.message) ? err.message : "Failed to register. Please try again.";

                if (err && err.errors) {
                    if (err.errors.name) document.getElementById("name-error").textContent = err.errors.name;
                    if (err.errors.email) document.getElementById("email-error").textContent = err.errors.email;
                    if (err.errors.password) document.getElementById("password-error").textContent = err.errors.password;
                }
            });
        });
    </script>
</body>
</html>
