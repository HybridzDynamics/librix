<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Catalogue | Librix</title>
    <meta name="description" content="Browse the complete digital book catalogue of LibriX. Filter by category, availability, and smart readability grade.">
    <link rel="icon" type="image/png" href="../assets/images/favicon.png">
    <link rel="stylesheet" href="../assets/css/global.css">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/catalogue.css">
    <script src="../assets/js/icons.js"></script>
</head>

<body>
    <!-- Navigation Bar -->
    <nav id="nav-bar">
        <div class="nav-brand">
            <a href="../index.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none;">
                <img src="../assets/images/logo.png" alt="Librix Logo" id="logo">
                <h1 style="margin: 0;">Librix</h1>
            </a>
        </div>
        <div class="nav-links">
            <a href="../index.html">Home</a>
            <a href="catalogue.html" class="active">Catalogue</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
            <a href="status.html">System Status</a>
        </div>
        <div class="nav-auth" id="nav-auth-container">
            <a href="login.html" class="btn btn-outline btn-sm">Login</a>
            <a href="register.html" class="btn btn-primary btn-sm">Sign Up</a>
        </div>
    </nav>

    <!-- Catalogue Header -->
    <header class="catalogue-header">
        <div class="container">
            <h1>Digital Book Catalogue</h1>
            <p>Explore thousands of titles, analyze reading difficulty scores, and check physical copy availability in real-time.</p>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container" style="padding-bottom: 80px;">
        <!-- Search and Filter Bar -->
        <div class="search-filter-bar">
            <!-- Search -->
            <div class="search-input-wrapper">
                <span class="search-icon">🔍</span>
                <input
                    type="text"
                    id="catalogue-search"
                    class="search-input"
                    placeholder="Search by title, author, ISBN..."
                >
            </div>

            <!-- Category Filter -->
            <div class="filter-group">
                <select id="filter-category" class="form-select">
                    <option value="">All Categories</option>
                    <!-- Populated dynamically -->
                </select>
            </div>

            <!-- Availability Filter -->
            <div class="filter-group">
                <select id="filter-availability" class="form-select">
                    <option value="">All Statuses</option>
                    <option value="available">Available Now</option>
                    <option value="unavailable">Checked Out / Reserved</option>
                </select>
            </div>

            <!-- Sort By -->
            <div class="filter-group">
                <select id="filter-sort" class="form-select">
                    <option value="title_asc">Title (A-Z)</option>
                    <option value="title_desc">Title (Z-A)</option>
                    <option value="year_desc">Newest Publication</option>
                    <option value="available_desc">Most Copies Available</option>
                </select>
            </div>
        </div>

        <!-- Status & Results Count Bar -->
        <div style="display: flex; justify-content: space-between; align-items: center; margin: 36px 0 24px; font-size: var(--font-sm); color: var(--text-muted);">
            <div id="results-count">Loading catalogue...</div>
            <div id="active-filters-badges" style="display: flex; gap: 8px; flex-wrap: wrap;"></div>
        </div>

        <!-- Book Grid -->
        <div id="books-grid" class="grid grid-4">
            <!-- Skeletons -->
            <div class="card" style="height: 380px;">
                <div class="skeleton" style="height: 200px;"></div>
                <div style="padding: 16px;">
                    <div class="skeleton" style="height: 20px; width: 85%; margin-bottom: 8px;"></div>
                    <div class="skeleton" style="height: 14px; width: 60%; margin-bottom: 16px;"></div>
                    <div class="skeleton" style="height: 36px; width: 100%;"></div>
                </div>
            </div>
            <div class="card" style="height: 380px;">
                <div class="skeleton" style="height: 200px;"></div>
                <div style="padding: 16px;">
                    <div class="skeleton" style="height: 20px; width: 85%; margin-bottom: 8px;"></div>
                    <div class="skeleton" style="height: 14px; width: 60%; margin-bottom: 16px;"></div>
                    <div class="skeleton" style="height: 36px; width: 100%;"></div>
                </div>
            </div>
            <div class="card" style="height: 380px;">
                <div class="skeleton" style="height: 200px;"></div>
                <div style="padding: 16px;">
                    <div class="skeleton" style="height: 20px; width: 85%; margin-bottom: 8px;"></div>
                    <div class="skeleton" style="height: 14px; width: 60%; margin-bottom: 16px;"></div>
                    <div class="skeleton" style="height: 36px; width: 100%;"></div>
                </div>
            </div>
            <div class="card" style="height: 380px;">
                <div class="skeleton" style="height: 200px;"></div>
                <div style="padding: 16px;">
                    <div class="skeleton" style="height: 20px; width: 85%; margin-bottom: 8px;"></div>
                    <div class="skeleton" style="height: 14px; width: 60%; margin-bottom: 16px;"></div>
                    <div class="skeleton" style="height: 36px; width: 100%;"></div>
                </div>
            </div>
        </div>

        <!-- Pagination -->
        <div id="pagination-container" class="pagination-wrapper" style="display: none;"></div>
    </main>

    <!-- Footer -->
    <footer style="background: #0f172a; color: #94a3b8; padding: 40px 0 20px; border-top: 1px solid #1e293b;">
        <div class="container" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; font-size: var(--font-sm);">
            <div style="display: flex; align-items: center; gap: 8px;">
                <img src="../assets/images/logo.png" alt="Librix Logo" style="width: 24px; height: 24px;">
                <span style="color: #fff; font-weight: 700;">Librix</span>
                <span>&copy; 2026 All rights reserved.</span>
            </div>
            <div style="display: flex; gap: 16px;">
                <a href="about.html" style="color: #94a3b8;">About</a>
                <a href="contact.html" style="color: #94a3b8;">Contact</a>
                <a href="status.html" style="color: #94a3b8;">Status</a>
            </div>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/utils.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script>
        let currentPage = 1;
        const pageSize = 12;
        let totalPages = 1;

        // Elements
        const searchInput = document.getElementById("catalogue-search");
        const categorySelect = document.getElementById("filter-category");
        const availabilitySelect = document.getElementById("filter-availability");
        const sortSelect = document.getElementById("filter-sort");
        const resultsCountEl = document.getElementById("results-count");
        const booksGrid = document.getElementById("books-grid");
        const paginationContainer = document.getElementById("pagination-container");

        // Load Categories into filter
        async function loadCategories() {
            try {
                const res = await api.get('/categories');
                const categories = Array.isArray(res.data) ? res.data : [];
                categories.forEach(cat => {
                    const opt = document.createElement("option");
                    opt.value = cat.name;
                    opt.textContent = `${cat.name} (${cat.total_books})`;
                    categorySelect.appendChild(opt);
                });
            } catch (err) {
                // Ignore if category fetch fails
            }
        }

        // Fetch & Render Books
        async function loadBooks() {
            booksGrid.innerHTML = `
                <div class="card" style="height: 380px;"><div class="skeleton" style="height: 100%;"></div></div>
                <div class="card" style="height: 380px;"><div class="skeleton" style="height: 100%;"></div></div>
                <div class="card" style="height: 380px;"><div class="skeleton" style="height: 100%;"></div></div>
                <div class="card" style="height: 380px;"><div class="skeleton" style="height: 100%;"></div></div>
            `;

            const query = {
                page: currentPage,
                limit: pageSize,
                search: searchInput.value.trim(),
                category: categorySelect.value,
                available: availabilitySelect.value === "available" ? 1 : "",
                sort: sortSelect.value
            };

            try {
                const res = await api.get('/books', query);
                const books = res.data && res.data.books ? res.data.books : (Array.isArray(res.data) ? res.data : []);
                const pagination = res.pagination || (res.data && res.data.pagination) || { total: books.length, total_pages: 1 };

                totalPages = pagination.total_pages || 1;
                resultsCountEl.innerHTML = `Showing <strong>${books.length}</strong> of <strong>${pagination.total || books.length}</strong> books`;

                if (books.length === 0) {
                    renderEmptyState();
                    paginationContainer.style.display = "none";
                    return;
                }

                renderBooks(books);
                renderPagination(pagination.page || currentPage, totalPages);

            } catch (err) {
                booksGrid.innerHTML = `
                    <div style="grid-column: 1/-1; text-align: center; padding: 60px 20px;">
                        <p style="color: var(--danger); font-weight: 600; margin-bottom: 12px;">Failed to load catalogue books.</p>
                        <button class="btn btn-outline btn-sm" onclick="loadBooks()">Try Again</button>
                    </div>
                `;
                resultsCountEl.textContent = "Error loading books";
                paginationContainer.style.display = "none";
            }
        }

        function renderBooks(books) {
            booksGrid.innerHTML = books.map(book => {
                const isAvailable = (book.available_copies > 0);
                const availabilityBadge = isAvailable
                    ? `<span class="badge badge-success">${book.available_copies} Available</span>`
                    : `<span class="badge badge-danger">Reserved / Out</span>`;

                const cover = book.cover_image
                    ? `<img src="${book.cover_image}" alt="${utils.escapeHtml(book.title)}" class="book-cover-img">`
                    : `<div class="book-cover-fallback">📚</div>`;

                return `
                    <div class="book-card-item">
                        <div class="book-cover-wrap">
                            ${cover}
                            <button 
                                class="book-fav-btn" 
                                title="Add to Favorites" 
                                onclick="toggleFavorite(event, ${book.id})"
                                id="fav-btn-${book.id}"
                            >
                                ♡
                            </button>
                        </div>
                        <div class="book-card-body">
                            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                                <span class="badge badge-primary">${utils.escapeHtml(book.category || 'General')}</span>
                                ${availabilityBadge}
                            </div>
                            <h3 class="book-title" title="${utils.escapeHtml(book.title)}">
                                ${utils.escapeHtml(book.title)}
                            </h3>
                            <div class="book-author">
                                By ${utils.escapeHtml(book.author_name || 'Unknown Author')} ${book.publication_year ? `(${book.publication_year})` : ''}
                            </div>
                            
                            <div class="book-readability-snippet">
                                <span style="color: var(--text-muted);">Difficulty:</span>
                                <span style="font-weight: 600; color: var(--primary);">Standard (Grade 8)</span>
                            </div>

                            <div style="margin-top: auto; display: flex; gap: 8px;">
                                <a href="book-details.html?id=${book.id}" class="btn btn-outline btn-sm" style="flex: 1;">
                                    Details & Scores
                                </a>
                                ${isAvailable ? `
                                    <button class="btn btn-primary btn-sm" onclick="quickBorrow(${book.id}, '${utils.escapeHtml(book.title)}')">
                                        Borrow
                                    </button>
                                ` : `
                                    <button class="btn btn-secondary btn-sm" onclick="quickReserve(${book.id}, '${utils.escapeHtml(book.title)}')">
                                        Reserve
                                    </button>
                                `}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderEmptyState() {
            booksGrid.innerHTML = `
                <div style="grid-column: 1/-1;" class="empty-state">
                    <div class="empty-state-icon">🔍</div>
                    <div class="empty-state-title">No books match your criteria</div>
                    <div class="empty-state-desc">Try modifying your search keywords, category filters, or availability status.</div>
                    <button class="btn btn-outline btn-sm" onclick="resetFilters()">Reset All Filters</button>
                </div>
            `;
        }

        function renderPagination(current, total) {
            if (total <= 1) {
                paginationContainer.style.display = "none";
                return;
            }

            paginationContainer.style.display = "flex";
            let html = `
                <button class="page-btn" ${current <= 1 ? 'disabled' : ''} onclick="goToPage(${current - 1})">
                    ← Prev
                </button>
            `;

            for (let i = 1; i <= total; i++) {
                if (i === 1 || i === total || (i >= current - 2 && i <= current + 2)) {
                    html += `
                        <button class="page-btn ${i === current ? 'is-active' : ''}" onclick="goToPage(${i})">
                            ${i}
                        </button>
                    `;
                } else if (i === current - 3 || i === current + 3) {
                    html += `<span style="padding: 0 4px; color: var(--text-subtle);">...</span>`;
                }
            }

            html += `
                <button class="page-btn" ${current >= total ? 'disabled' : ''} onclick="goToPage(${current + 1})">
                    Next →
                </button>
            `;

            paginationContainer.innerHTML = html;
        }

        function goToPage(page) {
            currentPage = page;
            loadBooks();
            window.scrollTo({ top: 200, behavior: 'smooth' });
        }

        function resetFilters() {
            searchInput.value = '';
            categorySelect.value = '';
            availabilitySelect.value = '';
            sortSelect.value = 'title_asc';
            currentPage = 1;
            loadBooks();
        }

        // Quick Actions
        async function toggleFavorite(e, bookId) {
            e.stopPropagation();
            if (!auth.isLoggedIn()) {
                utils.toast("Authentication Required", "Please log in to save favorite books.", "warning");
                return;
            }
            try {
                const res = await api.post('/favorites', { book_id: bookId });
                const btn = document.getElementById(`fav-btn-${bookId}`);
                if (res.data && res.data.favorited) {
                    btn.classList.add('is-active');
                    btn.textContent = '♥';
                    utils.toast("Added to Favorites", res.message, "success");
                } else {
                    btn.classList.remove('is-active');
                    btn.textContent = '♡';
                    utils.toast("Removed", res.message, "info");
                }
            } catch (err) {
                utils.toast("Error", err.message, "error");
            }
        }

        async function quickBorrow(bookId, title) {
            if (!auth.isLoggedIn()) {
                utils.toast("Login Required", "Please log in to borrow books.", "warning");
                setTimeout(() => window.location.href = "login.html", 1200);
                return;
            }

            const confirmed = await utils.confirm({
                title: 'Borrow Book',
                message: `Confirm borrowing "${title}" for a standard 14-day checkout?`,
                confirmText: 'Borrow Book',
                icon: 'book-open',
                type: 'primary'
            });

            if (!confirmed) return;

            try {
                await api.post('/library/issue', { book_id: bookId });
                utils.toast("Book Borrowed", `You have successfully borrowed "${title}".`, "success");
                loadBooks();
            } catch (err) {
                utils.toast("Borrow Failed", err.message, "danger");
            }
        }

        async function quickReserve(bookId, title) {
            if (!auth.isLoggedIn()) {
                utils.toast("Login Required", "Please log in to place reservations.", "warning");
                setTimeout(() => window.location.href = "login.html", 1200);
                return;
            }

            const confirmed = await utils.confirm({
                title: 'Place Book Hold / Reservation',
                message: `Reserve "${title}"? You will be notified the instant a copy is checked back in.`,
                confirmText: 'Place Reservation',
                icon: 'bookmark',
                type: 'primary'
            });

            if (!confirmed) return;

            try {
                await api.post('/library/reserve', { book_id: bookId });
                utils.toast("Reservation Placed", `Reserved "${title}".`, "success");
                loadBooks();
            } catch (err) {
                utils.toast("Reservation Failed", err.message, "danger");
            }
        }

        // Event listeners
        searchInput.addEventListener("input", utils.debounce(() => {
            currentPage = 1;
            loadBooks();
        }, 350));

        categorySelect.addEventListener("change", () => {
            currentPage = 1;
            loadBooks();
        });

        availabilitySelect.addEventListener("change", () => {
            currentPage = 1;
            loadBooks();
        });

        sortSelect.addEventListener("change", () => {
            currentPage = 1;
            loadBooks();
        });

        // Init
        loadCategories();
        loadBooks();
    </script>
</body>

</html>
