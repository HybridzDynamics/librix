<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta name="theme-color" content="#4f46e5">
    <title>Login | Librix</title>
    <link rel="icon" type="image/png" href="../assets/images/favicon.png">
    <link rel="stylesheet" href="../assets/css/global.css">
    <link rel="stylesheet" href="../assets/css/login.css">
    <script src="../assets/js/icons.js"></script>
</head>

<body>
    <main class="login-page">
        <div class="login-container">

            <div class="login-brand">
                <img src="../assets/images/logo.png" alt="Librix Logo">
                <h1>Librix</h1>
            </div>

            <div class="login-card">

                <div class="login-header">
                    <h2>Welcome back</h2>
                    <p>Sign in to your Librix account.</p>
                </div>

                <div id="alert-box" style="display: none; padding: 10px 14px; margin-bottom: 16px; border-radius: var(--radius-md); font-size: var(--font-sm);"></div>

                <form id="login-form" class="login-form" novalidate style="display: flex; flex-direction: column; gap: 18px;">

                    <div>
                        <label for="email" style="display: block; font-size: var(--font-sm); font-weight: 600; margin-bottom: 6px; color: var(--text-main);">Email Address <span style="color: var(--danger);">*</span></label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email"
                            autocomplete="email"
                            required
                            style="width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--radius); font-size: var(--font-sm); background: #ffffff;"
                        >
                        <div id="email-error" style="font-size: var(--font-xs); color: var(--danger); margin-top: 4px;"></div>
                    </div>

                    <div>
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
                            <label for="password" style="font-size: var(--font-sm); font-weight: 600; color: var(--text-main);">Password <span style="color: var(--danger);">*</span></label>
                            <a href="#" id="forgot-password-link" style="font-size: var(--font-xs); color: var(--primary);">Forgot password?</a>
                        </div>
                        <div style="position: relative;">
                            <input
                                type="password"
                                id="password"
                                name="password"
                                placeholder="Enter your password"
                                autocomplete="current-password"
                                required
                                style="width: 100%; padding: 10px 12px; padding-right: 40px; border: 1px solid var(--border); border-radius: var(--radius); font-size: var(--font-sm); background: #ffffff;"
                            >
                            <button
                                type="button"
                                id="togglePassword"
                                aria-label="Show password"
                                style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; padding: 0; display: flex; align-items: center; color: var(--text-muted);"
                            >
                                <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/>
                                    <circle cx="12" cy="12" r="3"/>
                                </svg>
                            </button>
                        </div>
                        <div id="password-error" style="font-size: var(--font-xs); color: var(--danger); margin-top: 4px;"></div>
                    </div>

                    <div style="display: flex; align-items: center; gap: 8px;">
                        <input type="checkbox" name="remember" id="remember" style="width: 16px; height: 16px; cursor: pointer;">
                        <label for="remember" style="font-size: var(--font-sm); color: var(--text-main); cursor: pointer;">Remember me</label>
                    </div>

                    <button type="submit" id="submit-btn" class="btn btn-primary" style="width: 100%; padding: 12px; font-weight: 600;">
                        Sign In
                    </button>
                </form>

                <div class="divider">
                    <span>OR</span>
                </div>

                <div class="register-section">
                    <p>Don't have an account?</p>
                    <a href="register.html">Create an account</a>
                </div>
            </div>

            <a href="../index.html" class="back-home">← Back to Home</a>
        </div>
    </main>

    <footer class="login-footer">
        <p>&copy; 2026 Librix. All rights reserved.</p>
    </footer>

    <script src="../assets/js/icons.js"></script>
    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/utils.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script>

        document.addEventListener('DOMContentLoaded', function() {
            auth.updateNav();
        });

        const passwordInput = document.getElementById("password");
        const togglePassword = document.getElementById("togglePassword");
        const eyeIcon = document.getElementById("eyeIcon");

        togglePassword.addEventListener("click", function () {
            if (passwordInput.type === "password") {
                passwordInput.type = "text";
                eyeIcon.innerHTML = `<path d="M3 3l18 18"/><path d="M10.58 10.58a2 2 0 0 0 2.83 2.83"/><path d="M9.88 5.08A10.43 10.43 0 0 1 12 5c5 0 8.73 4.11 9.94 6.5a1 1 0 0 1 0 1 2.5 4.5 0 0 1-1.42 1.65"/><path d="M6.61 6.61A10.43 10.43 0 0 0 2.06 11.5a1 1 0 0 0 0 .99C3.27 14.89 7 19 12 19a10.43 10.43 0 0 0 5.39-1.61"/>`;
            } else {
                passwordInput.type = "password";
                eyeIcon.innerHTML = `<path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/>`;
            }
        });

        const form = document.getElementById("login-form");
        const submitBtn = document.getElementById("submit-btn");
        const alertBox = document.getElementById("alert-box");

        function clearErrors() {
            document.getElementById("email-error").textContent = "";
            document.getElementById("password-error").textContent = "";
            document.getElementById("email").style.borderColor = "var(--border)";
            document.getElementById("password").style.borderColor = "var(--border)";
            alertBox.style.display = "none";
        }

        form.addEventListener("submit", function (e) {
            e.preventDefault();
            clearErrors();

            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;

            let hasError = false;

            if (!email) {
                document.getElementById("email-error").textContent = "Email is required";
                document.getElementById("email").style.borderColor = "var(--danger)";
                hasError = true;
            }

            if (!password) {
                document.getElementById("password-error").textContent = "Password is required";
                document.getElementById("password").style.borderColor = "var(--danger)";
                hasError = true;
            }

            if (hasError) return;

            submitBtn.disabled = true;
            submitBtn.textContent = 'Signing in...';

            auth.login(email, password).then(function(data) {
                utils.toast("Signed in", `Welcome back, ${data.user.name}!`, "success");

                const navParams = utils.getNavParams();
                const redirectParam = navParams.redirect;
                utils.clearNavParams();

                setTimeout(() => {
                    if (redirectParam) {
                        utils.navigate(decodeURIComponent(redirectParam));
                    } else if (data.user.role === 'admin') {
                        utils.navigate('admin/dashboard.html');
                    } else if (data.user.role === 'librarian') {
                        utils.navigate('librarian/dashboard.html');
                    } else {
                        utils.navigate('user/dashboard.html');
                    }
                }, 800);

            }).catch(function(err) {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Sign In';

                alertBox.style.display = "block";
                alertBox.style.backgroundColor = "#fee2e2";
                alertBox.style.color = "#991b1b";
                alertBox.style.border = "1px solid #fecaca";
                alertBox.textContent = (err && err.message) ? err.message : "Invalid email or password.";
            });
        });

        document.getElementById("forgot-password-link").addEventListener("click", (e) => {
            e.preventDefault();
            utils.toast("Password Recovery", "Please contact your library administrator or use the password reset endpoint.", "info", 5000);
        });

    </script>
</body>
</html>
