<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Librix</title>
    <link rel="icon" type="image/png" href="../assets/images/favicon.png">
    <link rel="stylesheet" href="../assets/css/global.css">
    <link rel="stylesheet" href="../assets/css/login.css">
</head>

<body>
    <main class="login-page">
        <div class="login-container">
            <!-- Brand -->
            <div class="login-brand">
                <img src="../assets/images/logo.png" alt="Librix Logo">
                <h1>Librix</h1>
            </div>

            <!-- Login Card -->
            <div class="login-card">
                <!-- Header -->
                <div class="login-header">
                    <h2>Welcome back</h2>
                    <p>Sign in to your Librix account.</p>
                </div>

                <!-- Alert Box -->
                <div id="alert-box" style="display: none; padding: 10px 14px; margin-bottom: 16px; border-radius: var(--radius-md); font-size: var(--font-sm);"></div>

                <!-- Login Form -->
                <form id="login-form" class="login-form" novalidate>
                    <!-- Email -->
                    <div class="form-group">
                        <label for="email" class="form-label">Email Address <span class="required">*</span></label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            class="form-input"
                            placeholder="Enter your email"
                            autocomplete="email"
                            required
                        >
                        <div class="form-error" id="email-error"></div>
                    </div>

                    <!-- Password -->
                    <div class="form-group">
                        <div class="password-header">
                            <label for="password" class="form-label">Password <span class="required">*</span></label>
                            <a href="#" id="forgot-password-link" style="font-size: var(--font-xs);">Forgot password?</a>
                        </div>
                        <div class="password-input">
                            <input
                                type="password"
                                id="password"
                                name="password"
                                class="form-input"
                                placeholder="Enter your password"
                                autocomplete="current-password"
                                required
                            >
                            <button
                                type="button"
                                class="toggle-password"
                                id="togglePassword"
                                aria-label="Show password"
                            >
                                <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/>
                                    <circle cx="12" cy="12" r="3"/>
                                </svg>
                            </button>
                        </div>
                        <div class="form-error" id="password-error"></div>
                    </div>

                    <!-- Remember Me -->
                    <div class="remember-row">
                        <label class="form-checkbox-label">
                            <input type="checkbox" name="remember" class="form-checkbox" id="remember">
                            <span>Remember me</span>
                        </label>
                    </div>

                    <!-- Login Button -->
                    <button type="submit" id="submit-btn" class="login-submit btn-primary">
                        <span>Sign In</span>
                    </button>
                </form>

                <!-- Divider -->
                <div class="divider">
                    <span>OR</span>
                </div>

                <!-- Register -->
                <div class="register-section">
                    <p>Don't have an account?</p>
                    <a href="register.html">Create an account</a>
                </div>
            </div>

            <!-- Back Home -->
            <a href="../index.html" class="back-home">← Back to Home</a>
        </div>
    </main>

    <!-- Footer -->
    <footer class="login-footer">
        <p>&copy; 2026 Librix. All rights reserved.</p>
    </footer>

    <!-- Scripts -->
    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/utils.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script>
        // Password toggle
        const passwordInput = document.getElementById("password");
        const togglePassword = document.getElementById("togglePassword");
        const eyeIcon = document.getElementById("eyeIcon");

        togglePassword.addEventListener("click", function () {
            if (passwordInput.type === "password") {
                passwordInput.type = "text";
                eyeIcon.innerHTML = `<path d="M3 3l18 18"/><path d="M10.58 10.58a2 2 0 0 0 2.83 2.83"/><path d="M9.88 5.08A10.43 10.43 0 0 1 12 5c5 0 8.73 4.11 9.94 6.5a1 1 0 0 1 0 1 2.5 4.5 0 0 1-1.42 1.65"/><path d="M6.61 6.61A10.43 10.43 0 0 0 2.06 11.5a1 1 0 0 0 0 .99C3.27 14.89 7 19 12 19a10.43 10.43 0 0 0 5.39-1.61"/>`;
            } else {
                passwordInput.type = "password";
                eyeIcon.innerHTML = `<path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/>`;
            }
        });

        // Form Submit
        const form = document.getElementById("login-form");
        const submitBtn = document.getElementById("submit-btn");
        const alertBox = document.getElementById("alert-box");

        function clearErrors() {
            document.querySelectorAll(".form-error").forEach(el => el.textContent = "");
            document.querySelectorAll(".form-input").forEach(el => el.classList.remove("is-invalid"));
            alertBox.style.display = "none";
        }

        form.addEventListener("submit", async function (e) {
            e.preventDefault();
            clearErrors();

            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;

            let hasError = false;

            if (!email) {
                document.getElementById("email-error").textContent = "Email is required";
                document.getElementById("email").classList.add("is-invalid");
                hasError = true;
            }

            if (!password) {
                document.getElementById("password-error").textContent = "Password is required";
                document.getElementById("password").classList.add("is-invalid");
                hasError = true;
            }

            if (hasError) return;

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="spinner spinner-sm spinner-white"></span> Signing in...';

            try {
                const data = await auth.login(email, password);
                utils.toast("Signed in", `Welcome back, ${data.user.name}!`, "success");

                // Check redirect URL
                const urlParams = new URLSearchParams(window.location.search);
                const redirectParam = urlParams.get('redirect');

                setTimeout(() => {
                    if (redirectParam) {
                        window.location.href = decodeURIComponent(redirectParam);
                    } else if (data.user.role === 'admin') {
                        window.location.href = 'admin/dashboard.html';
                    } else {
                        window.location.href = 'user/dashboard.html';
                    }
                }, 800);

            } catch (err) {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<span>Sign In</span>';

                alertBox.style.display = "block";
                alertBox.style.backgroundColor = "var(--danger-light)";
                alertBox.style.color = "var(--danger-text)";
                alertBox.style.border = "1px solid var(--danger-border)";
                alertBox.textContent = err.message || "Invalid email or password.";
            }
        });

        // Forgot password notice
        document.getElementById("forgot-password-link").addEventListener("click", (e) => {
            e.preventDefault();
            utils.toast("Password Recovery", "Please contact your library administrator or use the password reset endpoint.", "info", 5000);
        });
    </script>
</body>
</html>
